name: 'Test'

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  ffchromium:
    name: Firefox and Chromium
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: package.json

      - name: Install Hass system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libturbojpeg

      - name: Install NPM Dependencies
        run: npm install

      - name: Install playwright
        run: npx playwright install --with-deps

      - name: Install Hass
        run: npx hass-taste-test

      - name: Build
        run: npm run build

      - name: Set up tests
        run: test/setup.sh

      - name: Test Firefox
        run: BROWSER=firefox npm run test

      - name: Test Chromium
        run: BROWSER=chromium npm run test

      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: |
            **/__diff_output__/**/

  webkit:
    name: Webkit
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: package.json

      - name: Install Hass
        run: npm install && npx hass-taste-test

      - name: Build
        run: npm run build

      - name: Install Libraries
        run: sudo apt-get -qq install libegl1 libopus0 libwoff1 libharfbuzz-icu0 gstreamer1.0-plugins-base libgstreamer-gl1.0-0 gstreamer1.0-plugins-bad libopenjp2-7 libwebpdemux2 libenchant1c2a libhyphen0 libgles2 gstreamer1.0-libav libevdev-dev

      - name: Test Webkit
        run: BROWSER=webkit npm run test || BROWSER=webkit npm run test

      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: |
            **/__diff_output__/**/
